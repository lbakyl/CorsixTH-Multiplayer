# CorsixTH multiplayer server. On the VPS:
#   docker compose up -d          start (pulls the published image)
#   docker compose logs -f        follow the log
#   docker compose pull && docker compose up -d   update
# See docs/multiplayer/vps-guide.md.
#
# To build from this checkout instead of pulling: docker compose up -d --build

services:
  corsixth-mp-server:
    image: ghcr.io/lbakyl/corsixth-mp-server:${CORSIXTH_MP_TAG:-latest}
    build: .
    container_name: corsixth-mp-server
    restart: unless-stopped
    ports:
      # Players connect here; the server port inside stays 47800.
      - "${CORSIXTH_MP_PUBLISH:-47800}:47800/tcp"
    environment:
      CORSIXTH_MP_LOG: ${CORSIXTH_MP_LOG:-INFO}
      CORSIXTH_MP_MOTD: ${CORSIXTH_MP_MOTD:-}
      CORSIXTH_MP_MAX_CONNECTIONS: ${CORSIXTH_MP_MAX_CONNECTIONS:-256}
      CORSIXTH_MP_MAX_PER_ADDRESS: ${CORSIXTH_MP_MAX_PER_ADDRESS:-8}
    # The server needs nothing from the host: no writable files, no
    # capabilities, no privileges.
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Later (headless referee, milestone S3): the referee needs Theme Hospital
    # data from your own copy, mounted read-only, never baked into the image:
    # volumes:
    #   - /srv/corsixth/themehos:/data/themehos:ro
